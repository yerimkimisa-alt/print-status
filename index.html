<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YERIM 인쇄물 제작관리시스템</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Apple 디자인 규칙(단일 강조색·그림자 없음·hairline·pill/8/18 모서리)을 업무 프로그램 밀도로 적용.
   글꼴 Pretendard. 상단 바는 Apple 글로벌 내비처럼 검정. */
/* 색: Apple 웹·시스템 팔레트. 강조색은 Action Blue 하나, 상태색은 Apple 시스템 색(빨강·주황·초록). */
:root{
  --primary:#0066cc; --primary-tint:rgba(0,102,204,.09); --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --ink-2:#424245; --muted:#86868b; --hairline:#d2d2d7; --soft:#f0f0f2;
  --canvas:#fff; --parch:#f5f5f7; --nav:#000; --tile:#1d1d1f;
  --red:#ff3b30; --red-ink:#d70015; --red-bg:#fff2f1; --red-line:#ffc9c5;
  --yellow:#c93400; --yellow-dot:#ff9500; --yellow-bg:#fff4e5;
  --green:#34c759; --green-ink:#248a3d; --done:#aeaeb2;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--parch);color:var(--ink);font:400 13px/1.5 var(--font);letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
input,select,button{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:where(button,input,select):focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100vh}
/* toolbar */
.tb{display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--nav);color:#f5f5f7;position:relative;z-index:5;color-scheme:dark}
.tb img{height:17px;display:block}
.tb .app-name{font-weight:600;font-size:14px;color:#f5f5f7;padding-left:14px;border-left:1px solid rgba(255,255,255,.24);letter-spacing:-.02em;position:relative;top:2px}
.tb .sp{flex:1}
.field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.tb .field{color:#a1a1a6}
.tb .field input,.tb .field select{background:rgba(255,255,255,.12);color:#f5f5f7}
.tb .field select option{color:var(--ink);background:#fff}
.tb .btn.sec{background:rgba(255,255,255,.14);color:#f5f5f7}
.tb .btn.pri{background:var(--primary-on-dark)}
.field input,.field select{height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--soft);font-size:13px;font-weight:400;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:9999px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform .1s}
.btn.pri{background:var(--primary);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.redline{background:var(--red);color:#fff}
.btn:active{transform:scale(.95)}
.btn.xs{height:26px;padding:0 11px;font-size:12px}

.body{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:0}
/* sidebar */
.side{background:rgba(255,255,255,.6);border-right:1px solid var(--hairline);overflow:auto;padding:18px 12px}
.side h6{display:flex;align-items:center;justify-content:space-between;margin:20px 10px 6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.side h6:first-child{margin-top:0}
.side h6 .btn{float:none!important;margin:0!important}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px;font-weight:400}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--primary-tint);color:var(--primary);font-weight:700}
.nav .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:11.5px;font-weight:700;min-width:22px;height:20px;padding:0 7px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center}
.cnt.red{background:var(--red);color:#fff} .cnt.zero{color:var(--done)}
.nav .who{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.nav .who.unset{color:var(--red-ink);font-weight:600}
.side .foot{margin:20px 10px 0;font-size:11.5px;color:var(--muted);line-height:1.8;border-top:1px solid var(--hairline);padding-top:12px}
.legend span{display:flex;align-items:center;gap:8px}

/* main */
.main{overflow:auto;min-width:0;padding-bottom:28px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 28px 18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.03em}
.ph .meta{margin-top:6px;color:var(--muted);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:9999px;font-size:13px;font-weight:700}
.badge.red{background:var(--red);color:#fff} .badge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge.green{background:#e8f8ec;color:var(--green-ink)} .badge.blue{background:var(--soft);color:var(--ink-2)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 28px}
.kpi{padding:16px 18px;background:var(--canvas);border-radius:18px}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.03em;margin-top:6px}
.kpi .v small{font-size:14px;font-weight:600;margin-left:3px;letter-spacing:0;color:var(--muted)}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.alarm{background:var(--primary);color:#fff}
.kpi.alarm .l,.kpi.alarm .s,.kpi.alarm .v small{color:rgba(255,255,255,.85)}
.kpi.warn .v{color:var(--yellow)}

.cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:12px;padding:12px 28px 0}
.panel{background:var(--canvas);border-radius:18px;overflow:hidden;min-width:0}
.panel+.panel{margin-top:12px}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.panel>header h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.panel>header .hint{font-size:11.5px;color:var(--muted)}
.panel>header .sp{flex:1}
.panel>header b{font-size:13px}
.panel.shame{border:1.5px solid var(--red)} /* outline 은 sticky 표 머리글에 가려져 끊김 → border 로 그림 */
.panel.shame>header h2{color:var(--red-ink);display:flex;align-items:center;gap:8px}
.panel.shame>header h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
.panel.shame>header b{background:var(--red);color:#fff;border-radius:9999px;padding:3px 11px}
.empty{padding:18px;color:var(--muted);font-size:12.5px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--canvas);font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
th:first-child,td:first-child{padding-left:18px} th:last-child,td:last-child{padding-right:18px}
.nw{white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle}
.dot.red{background:var(--red);animation:blink 1.1s infinite} .dot.yellow{background:var(--yellow-dot)}
.dot.green{background:var(--green)} .dot.blue{background:var(--done)}
@keyframes blink{50%{opacity:.25}} @media (prefers-reduced-motion:reduce){.dot.red,.panel.shame>header h2::before{animation:none}}
.over{font-size:17px;font-weight:700;line-height:1;color:var(--red-ink);letter-spacing:-.02em} .over small{font-size:11px;font-weight:600;margin-left:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:9999px;white-space:nowrap}
.tag.esc{background:var(--red);color:#fff} .tag.nudge{background:var(--soft);color:var(--ink-2)}
.tag.ret{background:var(--yellow-bg);color:var(--yellow)}
.who{font-weight:600} .who.unset{color:var(--red-ink)}
.sub{font-size:11.5px;color:var(--muted)}
.plan{font-size:12px;color:var(--ink-2)} .plan.none{color:var(--red-ink);font-weight:700}
.acts{display:flex;gap:5px;justify-content:flex-end}
tr.st-red td{background:var(--red-bg)} tr.st-yellow td{background:var(--yellow-bg)}
tr.st-blue td{color:var(--done)} tr.st-blue .who{color:var(--done)}
.shame tbody td{background:var(--canvas)}
.shame tbody tr:hover td,.all tbody tr:hover td{background:var(--parch)}

/* 부서별 제출 일정 레인: 가로 이동 · 가운데 열 확대(--k: 가운데 1 → 멀수록 0) · 카드 마우스오버 상세 */
.lanes{margin:12px 28px 0}
.ln-scroll{position:relative;overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:thin;border-top:1px solid var(--hairline)}
.ln-scroll.dragging{cursor:grabbing;user-select:none}
.ln-scroll.dragging .tcard{pointer-events:none}
.ln-grid{display:grid;width:max-content;position:relative}
.ln-corner{grid-row:1;grid-column:1;position:sticky;left:0;z-index:3;background:var(--canvas);border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.ln-head{grid-row:1;padding:10px 12px 8px;text-align:center;border-bottom:1px solid var(--hairline);opacity:calc(.5 + .5*var(--k,0));transition:opacity .15s}
.ln-head b{display:block;font-size:13px;font-weight:700}
.ln-head span{font-size:11px;color:var(--muted)}
.ln-head.past b{color:var(--muted)}
.ln-head.is-today b,.ln-head.is-today span{color:var(--primary);font-weight:700}
.ln-label{grid-column:1;position:sticky;left:0;z-index:3;background:var(--canvas);padding:12px 14px;border-right:1px solid var(--hairline);border-bottom:1px solid var(--soft);display:flex;flex-direction:column;gap:1px}
.ln-label b{font-size:14px;font-weight:700}
.ln-label span{font-size:11px;color:var(--muted)}
.ln-label span.unset{color:var(--red-ink);font-weight:600}
.ln-label em{font-style:normal;align-self:flex-start;margin-top:6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9999px;padding:1px 9px}
.ln-cell{padding:10px 8px;border-bottom:1px solid var(--soft);border-left:1px solid var(--soft);display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));grid-template-rows:repeat(2,auto);grid-auto-flow:column;align-content:start;gap:8px;min-height:92px}
.ln-cell.past{background:#fafafc}
.ln-today{position:relative;z-index:2;display:flex;justify-content:center;pointer-events:none}
.ln-today::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--primary)}
.ln-today span{position:relative;margin-top:8px;align-self:flex-start;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;line-height:1.3;text-align:center;border-radius:8px;padding:5px 6px;letter-spacing:.02em}

.tcard{position:relative;background:var(--canvas);border:1px solid var(--hairline);border-radius:8px;padding:9px 11px;font-size:12px;cursor:default;
  transform:scale(calc(.92 + .08*var(--k,0)));opacity:calc(.55 + .45*var(--k,0));transition:transform .2s ease,opacity .2s,border-color .2s}
.tcard.st-red{background:var(--red-bg);border-color:var(--red-line);opacity:1}
.tcard.st-yellow{background:var(--yellow-bg);border-color:#ffd8a8}
.tcard.st-blue{color:var(--muted)}
.tcard:hover,.tcard:focus-within{transform:scale(1.06);opacity:1;border-color:var(--primary);z-index:4}
.tcard:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
.tc-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tc-due{margin-left:auto;font-size:11px;font-weight:700;white-space:nowrap}
.st-red .tc-due{color:var(--red-ink)} .st-yellow .tc-due{color:var(--yellow)} .st-green .tc-due{color:var(--green-ink)}
.tc-title{font-size:13px;font-weight:600;line-height:1.35;margin-top:4px;color:var(--ink)}
.st-blue .tc-title{color:var(--muted)}
.tc-who{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.tc-who .unset{color:var(--red-ink);font-weight:600}
.tc-more{max-height:0;overflow:hidden;transition:max-height .25s ease}
.tcard:hover .tc-more,.tcard:focus-within .tc-more{max-height:340px}
.tc-more dl{display:grid;grid-template-columns:50px minmax(0,1fr);gap:3px 8px;margin:9px 0 8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:11.5px}
.tc-more dt{color:var(--muted)} .tc-more dd{margin:0;color:var(--ink-2)}
.tc-more .hit{color:var(--red-ink);font-weight:600} .tc-more .path{word-break:break-all;font-size:10.5px}
.tc-more .acts{justify-content:flex-start;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.tcard,.tc-more,.ln-head{transition:none}}

/* ranking */
.rank{list-style:none;margin:0;padding:2px 18px 12px}
.rank li{display:grid;grid-template-columns:18px 96px minmax(0,1fr) 46px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.rank li:last-child{border-bottom:0}
.rank .no{font-size:12px;color:var(--muted);font-weight:700}
.rank .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:9999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:9999px} .bar i.low{background:var(--red)}
.rank .pct{text-align:right;font-weight:700;font-size:14px}
.rank .pct.low{color:var(--red-ink)}
.rank .meta{grid-column:2/-1;font-size:11.5px;color:var(--muted);margin-top:-4px}

.soon{list-style:none;margin:0;padding:0 0 6px}
.soon li{display:flex;gap:10px;align-items:center;padding:8px 18px;border-top:1px solid var(--soft);font-size:13px}
.soon .grow{flex:1;min-width:0}
.soon .d{font-weight:700;color:var(--yellow);white-space:nowrap}

.all{margin:12px 28px 0}
.all>header{flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:9999px;padding:3px}
.seg button{height:26px;padding:0 12px;border-radius:9999px;font-size:12px;font-weight:400;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--canvas);color:var(--ink);font-weight:700}
.search{height:32px;padding:0 14px;border:0;border-radius:9999px;font-size:13px;width:200px;background:var(--soft)}

dialog{border:0;border-radius:18px;padding:26px;width:min(380px,calc(100vw - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog form{display:grid;gap:14px}
dialog h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
dialog label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
dialog input{height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--soft);font-weight:400}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .app{height:auto;grid-template-rows:auto auto} .body{grid-template-columns:minmax(0,1fr)}
  .tb{flex-wrap:wrap;padding:10px 16px;gap:10px} .tb .sp{display:none}
  .side{order:2;border-right:0;border-top:1px solid var(--hairline)}
  .main{overflow:visible} .ph{padding:20px 16px 14px} .kpis{margin:0 16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cols{padding:10px 16px 0} .all{margin:10px 16px 0} .lanes{margin:10px 16px 0} .ln-grid{--lw:112px} .ln-label{padding:10px}
  .kpi .v{font-size:28px} .search{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <img src="assets/yerim-logo-white.png" alt="YERIM">
    <span class="app-name">인쇄물 제작관리시스템</span>
    <span class="sp"></span>
    <label class="field">기준일 <input type="date" id="today"></label>
    <label class="field">접속 부서 <select id="viewer"></select></label>
    <button class="btn pri" id="newbtn">+ 새 인쇄물</button>
    <button class="btn sec" id="reset" title="예시 데이터로 초기화">초기화</button>
    <button class="btn sec" id="install" hidden>앱 설치</button>
  </div>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<dialog id="newdlg">
  <form id="newform">
    <h3>새 인쇄물 등록</h3>
    <div class="sub">도어 카다로그 24주 일정으로 기한을 자동 계산함</div>
    <label>인쇄물명 <input name="name" required placeholder="예: 도어 카다로그 2028"></label>
    <label>D-Day (납품 완료일) <input name="dday" type="date" required></label>
    <div class="row"><button type="button" class="btn sec" id="cancel">취소</button><button class="btn pri">등록</button></div>
  </form>
</dialog>
<script src="schedule.js"></script>
<script src="app.js"></script>
</body>
</html>
